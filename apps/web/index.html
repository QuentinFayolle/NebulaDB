<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NebulaDB</title>
    <!--
      Applies the saved theme before the first paint. Deliberately not a
      module import (`utils/theme.ts`'s `loadThemePreset`/`applyThemePreset`
      duplicated inline instead): a `<script type="module">` is deferred
      until after the document is parsed, which is exactly late enough for
      the browser to have already painted once with the CSS default (dark) —
      a light-theme user would see one dark frame flash before switching,
      every load. Sync + blocking + inline is what avoids it. Failures are
      swallowed: a broken read must fall back to the CSS default, not blank
      the page before the app ever mounts.
    -->
    <script>
      (function () {
        try {
          const theme = localStorage.getItem("nebuladb.theme") ?? localStorage.getItem("athanordb.theme");
          if (theme === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
    <!--
      Deep link to a project: ask for what it needs now, not once the bundle has been parsed and the app
      has mounted. The session, the project summary and the live document are all known from the URL, so
      they travel while the JavaScript downloads; `src/utils/earlyStart.ts` hands them to the code that
      would have asked later. Silent on any failure: the application then asks the usual way.
    -->
    <script>
      (function () {
        try {
          var match = location.pathname.match(/^\/project\/([^\/]+)/);
          if (!match) return;
          var id = match[1];
          var early = (window.__nebulaEarly = { id: id, at: performance.now(), responses: {}, ws: null });
          early.responses["/api/auth/me"] = fetch("/api/auth/me");
          early.responses["/api/projects/" + id] = fetch("/api/projects/" + id);
          var socket = new WebSocket((location.protocol === "https:" ? "wss:" : "ws:") + "//" + location.host + "/ws/" + id);
          socket.binaryType = "arraybuffer";
          var ws = (early.ws = { socket: socket, buffered: [], step1Sent: true, taken: false });
          // Yjs sync step 1 for an empty document: message type 0, step 0, a state vector of one byte (0).
          socket.addEventListener("open", function () {
            socket.send(new Uint8Array([0, 0, 1, 0]));
          });
          socket.addEventListener("message", function (event) {
            if (!ws.taken) ws.buffered.push(event.data);
          });
          setTimeout(function () {
            if (!ws.taken) socket.close();
          }, 15000);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
